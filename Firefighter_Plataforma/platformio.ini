[env:esp32dev]

platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

; ============================================================
; FIREFIGHTER - ESP32 PRINCIPAL
;
; UART0 se utiliza exclusivamente para:
;
; ESP32 PRINCIPAL <-> ESP32-C3
;
; Deshabilitamos los logs internos del framework para evitar
; que mensajes de WiFi / UDP entren en el protocolo UART.
; ============================================================

build_flags =
    -DCORE_DEBUG_LEVEL=0